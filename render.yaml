services:
  - type: web
    name: airroute-delhi
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LOG_LEVEL
        value: info
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: https://air-route-delhi.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: FRONTEND_ORIGIN
        value: https://air-route-delhi.vercel.app
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
    healthCheckPath: /health
